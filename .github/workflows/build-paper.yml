name: Build manuscript PDF

on:
  push:
    branches: [main]
    paths:
      - 'paper/**'
      - '.github/workflows/build-paper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended
      - name: Build PDF
        run: |
          mkdir -p build
          latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=build paper/main.tex
      - uses: actions/upload-artifact@v4
        with:
          name: manuscript-pdf
          path: build/main.pdf
          if-no-files-found: error
